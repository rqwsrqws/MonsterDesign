<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Паук Monster-Lead → Telegram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      :root { font-family: Manrope, sans-serif; color: #f4f0ff; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(900px 480px at 18% 12%, rgba(168, 85, 247, 0.22), transparent 55%),
          linear-gradient(180deg, #09070f, #11081c);
      }
      .wrap { max-width: 1180px; margin: 0 auto; padding: 80px 24px 64px; }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        margin-bottom: 56px;
      }
      .brand-logo,
      .hero-3d-logo {
        display: block;
        background: transparent;
      }
      .brand-logo {
        width: 56px;
        height: auto;
        filter: drop-shadow(0 0 12px rgba(80, 200, 255, 0.45));
      }
      .layout {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 40px;
        align-items: center;
      }
      .hero-3d-logo,
      .logo-anim {
        width: min(100%, 420px);
        height: auto;
        margin: 0 auto;
        display: block;
        background: transparent;
        border: 0;
        outline: none;
        box-shadow: none;
        pointer-events: none;
        mix-blend-mode: screen;
        filter: none;
        -webkit-mask-image: radial-gradient(ellipse 52% 78% at 50% 36%, #000 34%, rgba(0, 0, 0, 0.82) 54%, transparent 72%);
        mask-image: radial-gradient(ellipse 52% 78% at 50% 36%, #000 34%, rgba(0, 0, 0, 0.82) 54%, transparent 72%);
      }
      @media (max-width: 800px) {
        .layout { grid-template-columns: 1fr; }
      }
      h1 { font-size: clamp(34px, 6vw, 58px); line-height: 1.08; margin: 0 0 16px; }
      .telegram-target {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        vertical-align: middle;
        padding: 0 4px 8px;
      }
      .tg-logo { width: 58px; height: 58px; filter: drop-shadow(0 8px 18px rgba(34, 158, 217, 0.45)); }
      .tg-word {
        background: linear-gradient(90deg, #6ec8ff, #2aa4d8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .spider {
        position: absolute;
        left: -34px;
        top: -22px;
        width: 148px;
        height: 136px;
        overflow: visible;
        pointer-events: none;
        transform-origin: 50% 62%;
        opacity: 0;
        filter: drop-shadow(0 0 10px rgba(208, 0, 255, 0.45));
      }
      .armor-plate { fill: url(#armor); stroke: #1a0a22; stroke-width: 1.2; }
      .body-shell { stroke: #3b164c; stroke-width: 2; }
      .neon-edge {
        fill: none; stroke: #e14bff; stroke-width: 3.1;
        stroke-linecap: round; stroke-linejoin: round; filter: url(#mlGlow);
      }
      .rib { fill: none; stroke: url(#ribGlow); stroke-width: 5.2; stroke-linecap: round; }
      .eyes ellipse { fill: #ff63ff; stroke: #ffd6ff; stroke-width: 0.8; }
      button {
        margin-top: 28px; border: 0; border-radius: 999px; padding: 12px 18px;
        font-weight: 700; color: white; cursor: pointer;
        background: linear-gradient(90deg, #7c3aed, #d946ef);
      }
      .video-block {
        margin-top: 72px;
        display: flex;
        justify-content: center;
      }
      .video-block .logo-anim {
        width: min(100%, 720px);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <img class="brand-logo" src="./spider-telegram-logo.png" alt="Monster-Lead" width="56" height="44" />
        <span>Monster-Lead CRM SYSTEM</span>
      </div>
      <div class="layout">
        <div>
      <h1>
        Автоматический сбор лидов из
        <span class="telegram-target" id="target">
          <svg class="tg-logo" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="22" fill="#229ed9" />
            <path fill="#fff" d="M34.8 14.6c.4-.2.8.2.6.7l-4.4 20.8c-.2.7-1 .9-1.6.5l-5.7-4.2-2.8 2.7c-.3.3-.8.1-.9-.3l-.6-5.3 10.8-9.7c.2-.2 0-.5-.2-.4L16.4 24.2l-4.8-1.5c-.8-.2-.8-1.3.1-1.6l23.1-6.5Z" />
          </svg>
          <span id="spider-slot"></span>
          <span class="tg-word">Telegram</span>
        </span>
        -чатов
      </h1>
      <p style="opacity:.72;font-size:18px">3D-лого паук + Telegram без белого фона. Смотри, как садится на тёмный сайт.</p>
      <button type="button" id="replay">Повторить анимацию</button>
        </div>
        <video class="hero-3d-logo" src="./generated_video.mp4" autoplay muted playsinline disablepictureinpicture></video>
      </div>
      <section class="video-block">
        <video class="logo-anim" src="./generated_video.mp4" autoplay muted playsinline disablepictureinpicture></video>
      </section>
    </div>
    <script>
      const LEGS = [
        { id: "r1", x: 304, y: 278, rest: 68, tibia: 48, tarsus: 26, len: [84, 74, 60], phase: 0 },
        { id: "r2", x: 338, y: 214, rest: 18, tibia: 32, tarsus: 18, len: [90, 72, 54], phase: Math.PI },
        { id: "r3", x: 336, y: 152, rest: -20, tibia: 28, tarsus: 14, len: [86, 68, 52], phase: 0 },
        { id: "r4", x: 308, y: 108, rest: -58, tibia: 26, tarsus: 12, len: [78, 64, 48], phase: Math.PI },
        { id: "l1", x: 196, y: 278, rest: 112, tibia: -48, tarsus: -26, len: [84, 74, 60], phase: Math.PI },
        { id: "l2", x: 162, y: 214, rest: 162, tibia: -32, tarsus: -18, len: [90, 72, 54], phase: 0 },
        { id: "l3", x: 164, y: 152, rest: 200, tibia: -28, tarsus: -14, len: [86, 68, 52], phase: Math.PI },
        { id: "l4", x: 192, y: 108, rest: 238, tibia: -26, tarsus: -12, len: [78, 64, 48], phase: 0 },
      ];

      const bone = (len, a, b) => `M 0 ${-a} L ${len} ${-b} L ${len} ${b} L 0 ${a} Z`;
      const edge = (len, a, b) => `M 0 ${-a} L ${len} ${-b}`;
      const lerp = (a, b, t) => a + (b - a) * t;
      const steppedEase = (p) => {
        const steps = 10;
        const x = p * steps;
        const i = Math.floor(x);
        const local = x - i;
        const smooth = local * local * (3 - 2 * local);
        return (i + smooth) / steps;
      };

      function spiderMarkup() {
        const legs = LEGS.map((leg) => `
          <g data-joint="${leg.id}-f" filter="url(#mlGlow)">
            <path class="armor-plate" d="${bone(leg.len[0], 11, 8)}" />
            <path class="neon-edge" d="${edge(leg.len[0], 11, 8)}" />
            <g data-joint="${leg.id}-t">
              <path class="armor-plate" d="${bone(leg.len[1], 8, 6)}" />
              <path class="neon-edge" d="${edge(leg.len[1], 8, 6)}" />
              <g data-joint="${leg.id}-s">
                <path class="armor-plate" d="${bone(leg.len[2], 6, 2.2)}" />
                <path class="neon-edge" d="${edge(leg.len[2], 6, 2.2)}" />
              </g>
            </g>
          </g>`).join("");

        return `
        <svg class="spider" viewBox="0 0 500 460" aria-hidden="true">
          <defs>
            <filter id="mlGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="3.8" result="blur" />
              <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
            <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2a1638" />
              <stop offset="42%" stop-color="#0c0a10" />
              <stop offset="100%" stop-color="#050308" />
            </linearGradient>
            <linearGradient id="ribGlow" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ff7bff" />
              <stop offset="55%" stop-color="#d000ff" />
              <stop offset="100%" stop-color="#7a00a8" />
            </linearGradient>
          </defs>
          ${legs}
          <g data-body filter="url(#mlGlow)">
            <path class="armor-plate body-shell" d="M250 64 C338 78 364 148 354 208 C344 262 304 286 250 292 C196 286 156 262 146 208 C136 148 162 78 250 64 Z" />
            <path class="neon-edge" d="M250 64 C338 78 364 148 354 208 C344 262 304 286 250 292 C196 286 156 262 146 208 C136 148 162 78 250 64 Z" />
            <path class="rib" d="M250 96 L250 248" />
            <path class="rib" d="M186 122 Q250 142 314 122" />
            <path class="rib" d="M172 158 Q250 184 328 158" />
            <path class="rib" d="M184 198 Q250 222 316 198" />
            <path class="rib" d="M208 232 Q250 248 292 232" />
            <path class="armor-plate" d="M214 250 C220 292 234 322 250 328 C266 322 280 292 286 250 C268 262 232 262 214 250 Z" />
            <path class="neon-edge" d="M214 250 C220 292 234 322 250 328 C266 322 280 292 286 250 C268 262 232 262 214 250 Z" />
            <g class="eyes">
              <ellipse cx="228" cy="272" rx="11" ry="7.5" />
              <ellipse cx="272" cy="272" rx="11" ry="7.5" />
              <ellipse cx="238" cy="288" rx="6.5" ry="4.5" />
              <ellipse cx="262" cy="288" rx="6.5" ry="4.5" />
            </g>
            <g data-fangs>
              <path class="armor-plate" d="M232 318 L214 378 L246 332 Z" />
              <path class="neon-edge" d="M232 318 L214 378 L246 332 Z" />
              <path class="armor-plate" d="M268 318 L286 378 L254 332 Z" />
              <path class="neon-edge" d="M268 318 L286 378 L254 332 Z" />
            </g>
          </g>
        </svg>`;
      }

      let stop = () => {};

      function play() {
        stop();
        document.getElementById("spider-slot").innerHTML = spiderMarkup();
        const root = document.querySelector(".spider");
        const start = performance.now();
        const climbMs = 5600;
        let frame;

        const tick = (now) => {
          const elapsed = now - start;
          const p = Math.min(1, elapsed / climbMs);
          const climb = steppedEase(p);
          const walking = p < 1;
          const gaitSpeed = walking ? 9.6 : 3.2;
          const phase = (elapsed / 1000) * gaitSpeed;
          const bob = Math.sin(phase * 2) * (walking ? 3.4 : 1.4);
          const x = lerp(86, 8, climb);
          const y = lerp(112, -58, climb) + bob;
          const rot = lerp(-26, 7, climb) + Math.sin(phase) * (walking ? 3.2 : 0.8);
          const scale = lerp(0.62, 1, climb);
          root.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
          root.style.opacity = elapsed < 120 ? String(elapsed / 120) : "1";
          const grip = Math.max(0, (p - 0.82) / 0.18);

          LEGS.forEach((leg) => {
            const swing = Math.sin(phase + leg.phase);
            const lift = Math.max(0, swing) * (walking ? 16 : 4);
            const femur = leg.rest + swing * (walking ? 16 : 5) - lift * 0.15;
            const tibia = leg.tibia - swing * (walking ? 22 : 6) - lift * 0.35 - grip * 8;
            const tarsus = leg.tarsus + swing * (walking ? 14 : 4) + lift * 0.2;
            root.querySelector(`[data-joint="${leg.id}-f"]`).setAttribute("transform", `translate(${leg.x} ${leg.y}) rotate(${femur})`);
            root.querySelector(`[data-joint="${leg.id}-t"]`).setAttribute("transform", `translate(${leg.len[0]} 0) rotate(${tibia})`);
            root.querySelector(`[data-joint="${leg.id}-s"]`).setAttribute("transform", `translate(${leg.len[1]} 0) rotate(${tarsus})`);
          });

          root.querySelector("[data-body]").setAttribute("transform", `translate(0 ${Math.sin(phase * 2) * 2.2})`);
          root.querySelector("[data-fangs]").setAttribute(
            "transform",
            `translate(250 318) scale(1 ${1 + Math.sin(elapsed / 180) * 0.04}) translate(-250 -318)`
          );
          frame = requestAnimationFrame(tick);
        };

        frame = requestAnimationFrame(tick);
        stop = () => cancelAnimationFrame(frame);
      }

      document.getElementById("replay").onclick = play;
      play();
      document.querySelectorAll("video").forEach((v) => {
        v.muted = true;
        v.play().catch(() => {});
      });
    </script>
  </body>
</html>
