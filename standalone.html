<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Паук Monster-Lead → Telegram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      :root { font-family: Manrope, sans-serif; color: #f4f0ff; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(900px 480px at 18% 12%, rgba(168, 85, 247, 0.22), transparent 55%),
          linear-gradient(180deg, #09070f, #11081c);
      }
      .wrap { max-width: 1180px; margin: 0 auto; padding: 80px 24px 64px; }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        margin-bottom: 56px;
      }
      .brand-logo,
      .hero-3d-logo {
        display: block;
        background: transparent;
      }
      .brand-logo {
        width: 56px;
        height: auto;
        filter: drop-shadow(0 0 12px rgba(80, 200, 255, 0.45));
      }
      .layout {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 40px;
        align-items: center;
      }
      .hero-3d-logo,
      .logo-anim {
        width: min(100%, 420px);
        height: auto;
        margin: 0 auto;
        display: block;
        background: transparent;
        border: 0;
        outline: none;
        box-shadow: none;
        pointer-events: none;
        mix-blend-mode: screen;
        filter: none;
        -webkit-mask-image: radial-gradient(ellipse 52% 78% at 50% 36%, #000 34%, rgba(0, 0, 0, 0.82) 54%, transparent 72%);
        mask-image: radial-gradient(ellipse 52% 78% at 50% 36%, #000 34%, rgba(0, 0, 0, 0.82) 54%, transparent 72%);
      }
      @media (max-width: 800px) {
        .layout { grid-template-columns: 1fr; }
      }
      h1 { font-size: clamp(34px, 6vw, 58px); line-height: 1.08; margin: 0 0 16px; }
      .telegram-target {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        vertical-align: middle;
        padding: 0 4px 8px;
      }
      .tg-logo { width: 58px; height: 58px; filter: drop-shadow(0 8px 18px rgba(34, 158, 217, 0.45)); }
      .tg-word {
        background: linear-gradient(90deg, #6ec8ff, #2aa4d8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .spider {
        position: absolute;
        left: -34px;
        top: -22px;
        width: 148px;
        height: 136px;
        overflow: visible;
        pointer-events: none;
        transform-origin: 50% 62%;
        opacity: 0;
        filter: drop-shadow(0 0 10px rgba(208, 0, 255, 0.45));
      }
      .armor-plate { fill: url(#armor); stroke: #1a0a22; stroke-width: 1.2; }
      .body-shell { stroke: #3b164c; stroke-width: 2; }
      .neon-edge {
        fill: none; stroke: #e14bff; stroke-width: 3.1;
        stroke-linecap: round; stroke-linejoin: round; filter: url(#mlGlow);
      }
      .rib { fill: none; stroke: url(#ribGlow); stroke-width: 5.2; stroke-linecap: round; }
      .eyes ellipse { fill: #ff63ff; stroke: #ffd6ff; stroke-width: 0.8; }
      button {
        margin-top: 28px; border: 0; border-radius: 999px; padding: 12px 18px;
        font-weight: 700; color: white; cursor: pointer;
        background: linear-gradient(90deg, #7c3aed, #d946ef);
      }
      .video-block {
        margin-top: 72px;
        display: flex;
        justify-content: center;
      }
      .video-block .logo-anim {
        width: min(100%, 720px);
      }
      .walk-row {
        margin-top: 56px;
        display: flex;
        justify-content: center;
        gap: 36px;
        flex-wrap: wrap;
      }
      .sphere {
        position: relative;
        width: min(42vw, 240px);
        height: min(42vw, 240px);
        border-radius: 50%;
        overflow: hidden;
      }
      .sphere::after {
        content: "";
        position: absolute;
        inset: 10% 18% auto;
        height: 28%;
        border-radius: 50%;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent);
        pointer-events: none;
      }
      .sphere-light { background: #fff; }
      .sphere-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        pointer-events: none;
        background: transparent;
        transform: scale(1.46);
        transform-origin: center center;
      }
      .sphere-dark {
        background: #121015;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      .walker-track {
        position: absolute;
        inset: 0;
        animation: pace 5.4s ease-in-out infinite;
      }
      .walker-track.reverse { animation-delay: -2.7s; }
      .walker {
        position: absolute;
        left: 50%;
        bottom: -18%;
        width: 168%;
        height: auto;
        transform: translateX(-50%);
        animation: steps 0.38s ease-in-out infinite;
        pointer-events: none;
      }
      .walker.invert { filter: invert(1); }
      @keyframes pace {
        0% { transform: translateX(-13%); }
        45% { transform: translateX(13%); }
        50% { transform: translateX(13%) scaleX(-1); }
        95% { transform: translateX(-13%) scaleX(-1); }
        100% { transform: translateX(-13%) scaleX(1); }
      }
      @keyframes steps {
        0%, 100% { translate: 0 0; rotate: -3deg; }
        50% { translate: 0 -9px; rotate: 4deg; }
      }
      .loader-light {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 48px 24px;
        color: #1b1328;
        background:
          radial-gradient(720px 420px at 50% 42%, rgba(168, 85, 247, 0.16), transparent 58%),
          linear-gradient(180deg, #f7f3ff 0%, #efe8ff 38%, #ffffff 100%);
      }
      .pulse-stage {
        position: relative;
        width: min(86vw, 420px);
        height: min(86vw, 420px);
        display: grid;
        place-items: center;
        overflow: visible;
        background: transparent;
      }
      .spider-web {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        background: transparent;
        border-radius: 50%;
        clip-path: circle(41% at 50% 50%);
      }
      .spider-web-base { opacity: 0.55; }
      .web-surge {
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: 50%;
        overflow: hidden;
        -webkit-mask-image: radial-gradient(circle, transparent 30%, #000 40%, #000 46%, transparent 58%);
        mask-image: radial-gradient(circle, transparent 30%, #000 40%, #000 46%, transparent 58%);
        animation: web-surge 2.6s ease-out infinite;
      }
      .web-surge .spider-web { opacity: 1; filter: brightness(1.25); }
      .pulse-ring {
        position: absolute;
        inset: 25%;
        border-radius: 50%;
        border: 1px solid rgba(124, 58, 237, 0.18);
        pointer-events: none;
        animation: loader-pulse 2.6s ease-out infinite;
        background: transparent;
      }
      .pulse-ring:nth-child(4) { animation-delay: 0.85s; }
      .pulse-ring:nth-child(5) { animation-delay: 1.7s; }
      .loader-shell {
        position: relative;
        z-index: 1;
        width: 50%;
        height: 50%;
        border-radius: 50%;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f6f4f8;
        --load: 0%;
        box-shadow: 0 10px 28px rgba(42, 24, 56, 0.16), 0 22px 48px rgba(124, 58, 237, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.85);
        animation: loader-breathe 2.6s ease-in-out infinite;
      }
      .loader-fill {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        overflow: hidden;
        pointer-events: none;
        -webkit-mask-image: radial-gradient(circle, transparent 34.6%, #000 35.4%);
        mask-image: radial-gradient(circle, transparent 34.6%, #000 35.4%);
      }
      .loader-liquid {
        position: absolute;
        left: -12%;
        right: -12%;
        bottom: 0;
        height: var(--load);
        background: linear-gradient(180deg, #c4b5fd 0%, #8b5cf6 48%, #6d28d9 100%);
        transition: height 0.28s ease-out;
      }
      .loader-wave {
        position: absolute;
        top: -13px;
        left: 0;
        width: 200%;
        height: 16px;
        fill: #c4b5fd;
        animation: liquid-wave 1.6s linear infinite;
      }
      .loader-orb {
        position: relative;
        z-index: 2;
        width: 70%;
        height: 70%;
        border-radius: 50%;
        overflow: hidden;
        background: #f6f4f8;
      }
      .loader-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        pointer-events: none;
        transform: scale(1.22);
        transform-origin: center center;
      }
      .loader-brand {
        margin: 8px 0 0;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #2a1838;
      }
      .loader-hint {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8b7aa0;
        animation: loader-dots 1.4s ease-in-out infinite;
      }
      @keyframes loader-pulse {
        0% { transform: scale(1); opacity: 0.5; }
        70% { opacity: 0.1; }
        100% { transform: scale(2.05); opacity: 0; }
      }
      @keyframes loader-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.045); }
      }
      @keyframes loader-dots {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes web-surge {
        0% { transform: scale(0.78); opacity: 0.95; }
        75% { opacity: 0.2; }
        100% { transform: scale(1.18); opacity: 0; }
      }
      @keyframes liquid-wave {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      .loader-pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .loader-light.is-dark {
        color: #f4f0ff;
        background:
          radial-gradient(720px 420px at 50% 42%, rgba(168, 85, 247, 0.22), transparent 58%),
          linear-gradient(180deg, #09070f 0%, #11081c 48%, #07060e 100%);
      }
      .loader-light.is-dark .spider-web-base {
        opacity: 0.72;
        filter: brightness(1.35) saturate(1.15);
      }
      .loader-light.is-dark .pulse-ring {
        border-color: rgba(232, 121, 249, 0.28);
      }
      .loader-light.is-dark .loader-shell,
      .loader-light.is-dark .loader-orb {
        background: #16121c;
      }
      .loader-light.is-dark .loader-shell {
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45), 0 0 28px rgba(168, 85, 247, 0.18), 0 0 0 1px rgba(232, 121, 249, 0.16);
      }
      .loader-light.is-dark .loader-liquid {
        background: linear-gradient(180deg, #e879f9 0%, #a855f7 48%, #6d28d9 100%);
      }
      .loader-light.is-dark .loader-wave { fill: #e879f9; }
      .loader-light.is-dark .loader-brand { color: #f4f0ff; }
      .loader-light.is-dark .loader-hint { color: rgba(244, 240, 255, 0.55); }
      @media (max-width: 900px) {
        .loader-pair { grid-template-columns: 1fr; }
      }
      .sidebar-play {
        padding: 48px 80px 72px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: visible;
        background: radial-gradient(600px 280px at 20% 0%, rgba(124, 58, 237, 0.18), transparent 55%), #09070f;
      }
      .theme-switch {
        margin: 0 0 18px; padding: 8px 16px; border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(255, 255, 255, 0.08);
        color: #f4f0ff; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
      }
      .play-title {
        margin: 0 0 16px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
        color: rgba(244, 240, 255, 0.45);
      }
      .sidebar-panel {
        position: relative;
        width: min(100%, 376px);
        padding: 18px 12px 12px;
        border-radius: 22px;
        background: #0e0c14;
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        overflow: visible;
      }
      .nav-drop {
        position: absolute;
        top: 0;
        right: -32px;
        width: 64px;
        height: 100%;
        pointer-events: none;
        z-index: 5;
      }
      .nav-silk {
        position: absolute;
        left: 50%;
        top: 0;
        width: 2px;
        height: var(--drop-y, 168px);
        transform: translateX(-50%);
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(196, 181, 253, 0.05), #c4b5fd 22%, #a855f7);
        box-shadow: 0 0 10px rgba(168, 85, 247, 0.75);
      }
      .nav-drop-pin {
        position: absolute;
        left: 50%;
        top: var(--drop-y, 168px);
        transform: translate(-50%, -50%);
      }
      .nav-drop-spider {
        display: block;
        width: 58px;
        height: auto;
        transform-origin: 50% 8%;
        filter: drop-shadow(0 10px 16px rgba(88, 28, 135, 0.55));
        animation: spider-sway 2.8s ease-in-out infinite;
      }
      @keyframes spider-sway {
        0%, 100% { transform: rotate(-5deg); }
        50% { transform: rotate(5deg); }
      }
      .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 8px 10px 18px; color: #f4f0ff; }
      .sidebar-mark {
        width: 34px; height: 34px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ff7bff, transparent 42%), radial-gradient(circle at 50% 50%, #7c3aed, #1a0824 72%);
      }
      .sidebar-brand strong { display: block; font-size: 14px; }
      .sidebar-brand small { display: block; margin-top: 2px; font-size: 10px; letter-spacing: 0.12em; color: rgba(244, 240, 255, 0.5); }
      .nav-group { margin: 16px 10px 8px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(244, 240, 255, 0.38); }
      .nav-stack { display: flex; flex-direction: column; gap: 6px; overflow: visible; }
      .nav-btn, .user-card {
        position: relative; isolation: isolate; overflow: visible; z-index: 0;
        width: 100%; display: flex; align-items: center; gap: 10px; border: 1px solid transparent; cursor: pointer;
        text-align: left; font-family: inherit; color: rgba(244, 240, 255, 0.86); background: transparent;
        outline: none; -webkit-tap-highlight-color: transparent;
        --slot: 38px; --slot-right: 5px;
      }
      .nav-btn:focus, .nav-btn:focus-visible, .nav-btn:active,
      .user-card:focus, .user-card:focus-visible, .user-card:active { outline: none; }
      .nav-btn::-moz-focus-inner, .user-card::-moz-focus-inner { border: 0; }
      .nav-btn {
        --btn-fill: transparent;
        height: 48px; min-height: 48px;
        padding: 0 calc(var(--slot-right) + var(--slot) + 14px) 0 14px;
        border-radius: 16px; color: rgba(228, 222, 245, 0.72); line-height: 1;
        transition: box-shadow 0.25s ease, background 0.25s ease;
        background: radial-gradient(circle calc(var(--slot) / 2) at calc(100% - (var(--slot-right) + var(--slot) / 2)) 50%, transparent calc(var(--slot) / 2 - 0.5px), var(--btn-fill) calc(var(--slot) / 2 + 0.5px));
      }
      .nav-socket {
        position: absolute; right: var(--slot-right); top: 50%; width: var(--slot); height: var(--slot);
        margin-top: calc(var(--slot) / -2);
        border-radius: 50%; pointer-events: none; overflow: hidden;
        background: rgba(5, 4, 10, 0.55); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .nav-orb {
        position: absolute; inset: -29%; width: 158%; height: 158%; max-width: none;
        object-fit: cover; object-position: center; opacity: 0; transform: none;
        transition: opacity 0.2s ease;
      }
      .nav-btn:hover:not(.is-active) .nav-orb, .user-card:hover:not(.is-active) .nav-orb { opacity: 0.34; }
      .nav-btn.is-active .nav-orb, .user-card.is-active .nav-orb { opacity: 1; }
      .nav-btn:hover { --btn-fill: rgba(255, 255, 255, 0.04); }
      .nav-btn:hover:not(.is-active), .user-card:hover:not(.is-active) { box-shadow: 0 0 14px rgba(34, 211, 238, 0.22); }
      .nav-btn.is-active, .user-card.is-active {
        --btn-fill: rgba(12, 28, 58, 0.72);
        z-index: 2; overflow: visible; border-radius: 16px; color: #f4f0ff;
        border: 1px solid transparent;
        box-shadow: none;
      }
      .nav-btn.is-active .nav-socket, .user-card.is-active .nav-socket {
        background: transparent;
        box-shadow: 0 0 0 1px rgba(125, 211, 252, 0.75), 0 0 10px rgba(34, 211, 238, 0.8), 0 0 20px rgba(14, 165, 233, 0.45);
      }
      .nav-btn.is-active .nav-ico {
        color: #f3e8ff; background: rgba(124, 58, 237, 0.42);
      }
      .nav-btn.is-active::before, .user-card.is-active::before { display: none; }
      .nav-web {
        position: absolute; inset: 0; z-index: 0; overflow: hidden; border-radius: 16px;
        pointer-events: none; opacity: 0; isolation: isolate; mix-blend-mode: screen;
      }
      .nav-btn.is-active .nav-web, .user-card.is-active .nav-web {
        --web-at: calc(100% - (var(--slot-right) + var(--slot) / 2));
        opacity: 1; clip-path: inset(0 0 0 100% round 16px);
        -webkit-mask-image: radial-gradient(circle calc(var(--slot) / 2) at var(--web-at) 50%, transparent calc(var(--slot) / 2 - 0.5px), #000 calc(var(--slot) / 2 + 0.5px));
        mask-image: radial-gradient(circle calc(var(--slot) / 2) at var(--web-at) 50%, transparent calc(var(--slot) / 2 - 0.5px), #000 calc(var(--slot) / 2 + 0.5px));
        animation: web-weave 1.35s cubic-bezier(0.45, 0.05, 0.2, 1) forwards;
      }
      .nav-web::before, .nav-web::after {
        content: ""; position: absolute; width: 188px; height: 188px;
        background: url("./spider-web.png") 46% 40% / 170% 170% no-repeat;
        mix-blend-mode: normal;
        filter: brightness(1.35) saturate(1.05); opacity: 0.46;
        -webkit-mask-image: radial-gradient(circle at 38% 52%, #000 18%, transparent 72%);
        mask-image: radial-gradient(circle at 38% 52%, #000 18%, transparent 72%);
      }
      .nav-web::before { left: -18%; top: -62%; transform: rotate(-52deg); }
      .nav-web::after { right: -14%; top: -70%; transform: rotate(28deg); }
      .nav-btn.is-active::after, .user-card.is-active::after {
        content: ""; position: absolute; inset: 0; border-radius: 16px; pointer-events: none; z-index: 0;
        border: 1px solid rgba(125, 211, 252, 0.85);
        box-shadow: inset 0 0 18px rgba(14, 165, 233, 0.28), 0 0 6px rgba(125, 211, 252, 0.95), 0 0 18px rgba(34, 211, 238, 0.7), 0 0 36px rgba(59, 130, 246, 0.38);
        clip-path: inset(0 0 0 calc(100% + 24px) round 16px);
        animation: neon-spread 1.35s cubic-bezier(0.45, 0.05, 0.2, 1) both, neon-idle 2.4s 1.35s ease-in-out infinite;
      }
      @keyframes neon-spread {
        from { clip-path: inset(0 0 0 calc(100% + 24px) round 16px); }
        to { clip-path: inset(0 round 16px); }
      }
      @keyframes neon-idle {
        0%, 100% { box-shadow: inset 0 0 18px rgba(14, 165, 233, 0.28), 0 0 6px rgba(125, 211, 252, 0.95), 0 0 18px rgba(34, 211, 238, 0.7), 0 0 36px rgba(59, 130, 246, 0.38); }
        50% { box-shadow: inset 0 0 22px rgba(14, 165, 233, 0.38), 0 0 10px rgba(186, 230, 253, 1), 0 0 26px rgba(34, 211, 238, 0.85), 0 0 48px rgba(59, 130, 246, 0.48); }
      }
      .nav-btn > *:not(.nav-socket):not(.nav-web), .user-card > *:not(.nav-socket):not(.nav-web) { position: relative; z-index: 1; }
      .nav-btn > .nav-socket, .user-card > .nav-socket { position: absolute; z-index: 3; }
      @keyframes web-weave {
        from { opacity: 0.16; clip-path: inset(0 0 0 100% round 16px); }
        to { opacity: 1; clip-path: inset(0 round 16px); }
      }
      .nav-btn.is-active .nav-ico { color: #f4f0ff; }
      .nav-btn.is-active .nav-num { color: #f4f0ff; background: #6d28d9; }
      .nav-ico, .nav-num, .nav-chev { display: grid; place-items: center; flex: 0 0 auto; color: rgba(244, 240, 255, 0.7); }
      .nav-ico { width: 28px; height: 28px; border-radius: 8px; }
      .nav-num { width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 800; color: #ddd6fe; background: #3b0764; }
      .nav-label { flex: 1; font-size: 14px; }
      .nav-badge { padding: 3px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; color: #e9d5ff; background: rgba(124, 58, 237, 0.35); }
      .nav-chev { transform: rotate(90deg); opacity: 0.45; }
      .user-card {
        --btn-fill: #16121c; margin-top: 0;
        padding: 10px calc(var(--slot-right) + var(--slot) + 14px) 10px 10px;
        border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05);
        background: radial-gradient(circle calc(var(--slot) / 2) at calc(100% - (var(--slot-right) + var(--slot) / 2)) 50%, transparent calc(var(--slot) / 2 - 0.5px), var(--btn-fill) calc(var(--slot) / 2 + 0.5px));
      }
      .user-ava { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #7c3aed, #db2777); }
      .user-meta strong { display: block; font-size: 13px; }
      .user-meta em { margin-left: 6px; font-style: normal; font-size: 10px; font-weight: 800; color: #fbbf24; }
      .user-meta small { display: block; margin-top: 3px; font-size: 11px; color: rgba(244, 240, 255, 0.48); }
      .sidebar-play.is-light {
        color: #2e2156;

    <script>
      document.querySelectorAll("video").forEach((v) => {
        v.muted = true;
        v.play().catch(() => {});
      });

      (function simulateLoad() {
        const shells = document.querySelectorAll(".loader-shell");
        const hints = document.querySelectorAll(".loader-hint");
        if (!shells.length) return;
        let value = 0;
        const id = setInterval(() => {
          value = Math.min(100, value + 1.4 + Math.random() * 3.2);
          shells.forEach((shell) => shell.style.setProperty("--load", `${value}%`));
          const text = value >= 100 ? "Готово" : `Загрузка ${Math.round(value)}%`;
          hints.forEach((hint) => { hint.textContent = text; });
          if (value >= 100) clearInterval(id);
        }, 160);
      })();

      (function spiderFollow() {
        const panel = document.querySelector(".sidebar-panel");
        const drop = panel && panel.querySelector(".nav-drop");
        if (!panel || !drop) return;
        let target = 168;
        let current = 168;
        let tracking = false;

        function clamp(y) {
          return Math.min(panel.offsetHeight - 20, Math.max(36, y));
        }

        function setTarget(y, isTracking) {
          tracking = isTracking;
          target = clamp(y);
        }

        function snapToActive() {
          const btn = panel.querySelector(".is-active");
          if (!btn) return;
          setTarget(btn.offsetTop + btn.offsetHeight / 2, false);
        }

        function tick() {
          current += (target - current) * (tracking ? 0.28 : 0.16);
          drop.style.setProperty("--drop-y", current + "px");
          requestAnimationFrame(tick);
        }

        panel.addEventListener("mousemove", (event) => {
          setTarget(event.clientY - panel.getBoundingClientRect().top, true);
        });
        panel.addEventListener("mouseleave", snapToActive);

        window.dropSpiderTo = function (btn) {
          if (!btn) return;
          setTarget(btn.offsetTop + btn.offsetHeight / 2, false);
        };

        snapToActive();
        current = target;
        tick();
      })();

      function selectNav(btn) {
        const panel = btn.closest(".sidebar-panel");
        if (!panel) return;
        panel.querySelectorAll(".nav-btn, .user-card").forEach((el) => {
          el.classList.toggle("is-active", el === btn);
        });
      }

      function toggleTheme() {
        document.querySelectorAll(".sidebar-play").forEach((el) => el.classList.toggle("is-light"));
        const light = document.querySelector(".sidebar-play").classList.contains("is-light");
        document.querySelectorAll(".theme-switch").forEach((btn) => {
          btn.textContent = light ? "Тёмная тема" : "Светлая тема";
        });
      }
    </script>
